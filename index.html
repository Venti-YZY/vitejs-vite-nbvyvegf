<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>维旅者</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Star Field Canvas -->
    <canvas id="cosmos"></canvas>

    <div class="page-wrapper">

        <!-- Header -->
        <header class="site-header">
            <p class="site-header__eyebrow">✦ The Dimensional Traveler ✦</p>
            <h1 class="site-header__title">维 <em>旅</em> 者</h1>
            <div class="site-header__divider">
                <mark>∞</mark>
            </div>
            <p class="site-header__subtitle">探索多维生命的奇妙旅程</p>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-nav__btn active" data-tab="share">
                <span class="tab-nav__icon">✧</span>
                <span>日常</span>
            </button>
            <button class="tab-nav__btn" data-tab="qa">
                <span class="tab-nav__icon">⟡</span>
                <span>问答</span>
            </button>
            <button class="tab-nav__btn" data-tab="knowledge">
                <span class="tab-nav__icon">◈</span>
                <span>知识</span>
            </button>
        </nav>

        <!-- Daily Share -->
        <section id="share" class="tab-section active">
            <div class="post-form">
                <div class="form-group">
                    <input type="text" id="share-nickname" placeholder="昵称…" maxlength="20">
                </div>
                <div class="form-group">
                    <textarea id="share-content" placeholder="分享你的灵性感悟、梦境、体悟…" maxlength="500"></textarea>
                </div>
                <button class="btn-submit" onclick="publishShare()">发布</button>
            </div>
            <div class="section-label">
                <span class="section-label__text">· 已发布 ·</span>
            </div>
            <div id="share-list" class="feed"></div>
        </section>

        <!-- Q&A -->
        <section id="qa" class="tab-section">
            <div class="post-form">
                <div class="form-group">
                    <input type="text" id="qa-nickname" placeholder="昵称…" maxlength="20">
                </div>
                <div class="form-group">
                    <input type="text" id="qa-title" placeholder="问题标题…" maxlength="100">
                </div>
                <div class="form-group">
                    <textarea id="qa-content" placeholder="详细描述你的问题…" maxlength="1000"></textarea>
                </div>
                <button class="btn-submit" onclick="publishQuestion()">提问</button>
            </div>
            <div class="section-label">
                <span class="section-label__text">· 待解答 ·</span>
            </div>
            <div id="qa-list" class="feed"></div>
        </section>

        <!-- Knowledge -->
        <section id="knowledge" class="tab-section">
            <div class="post-form">
                <div class="form-group">
                    <input type="text" id="knowledge-nickname" placeholder="作者…" maxlength="20">
                </div>
                <div class="form-group">
                    <input type="text" id="knowledge-title" placeholder="文章标题…" maxlength="100">
                </div>
                <div class="form-group">
                    <select id="knowledge-category">
                        <option value="">选择分类…</option>
                        <option value="tarot">塔罗牌</option>
                        <option value="astrology">占星术</option>
                        <option value="runes">卢恩符文</option>
                        <option value="divination">占卜</option>
                        <option value="ritual">仪式</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <textarea id="knowledge-content" placeholder="分享你的知识…" maxlength="5000"></textarea>
                </div>
                <button class="btn-submit" onclick="publishArticle()">发布</button>
            </div>
            <div class="section-label">
                <span class="section-label__text">· 智慧传承 ·</span>
            </div>
            <div id="knowledge-list" class="feed"></div>
        </section>

        <div class="load-more" id="load-more" onclick="loadMore()">
            加载更多
        </div>

    </div>

    <script src="script.js"></script>

    <!-- Star Field Generator -->
    <script>
    (function() {
        const canvas = document.getElementById('cosmos');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let W, H;
        let mouse = { x: 0, y: 0 };

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        function createStars(count) {
            stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.2 + 0.2,
                    opacity: Math.random(),
                    speed: Math.random() * 0.003 + 0.001,
                    twinkleSpeed: Math.random() * 0.008 + 0.002,
                    twinklePhase: Math.random() * Math.PI * 2,
                    color: Math.random() > 0.85
                        ? `rgba(201,162,39,${Math.random() * 0.5 + 0.3})`
                        : `rgba(255,255,255,${Math.random() * 0.4 + 0.2})`
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Deep space gradient
            const grad = ctx.createRadialGradient(W * 0.5, 0, 0, W * 0.5, H * 0.5, H * 0.8);
            grad.addColorStop(0, '#0d0d1a');
            grad.addColorStop(1, '#050508');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Draw stars
            stars.forEach(s => {
                s.twinklePhase += s.speed;
                const alpha = (Math.sin(s.twinklePhase) * 0.5 + 0.5) * s.opacity;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = s.color.replace(/[\d.]+\)$/, `${alpha})`);
                ctx.fill();

                // Subtle twinkle for gold stars
                if (s.color.includes('201,162,39')) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(201,162,39,${alpha * 0.08})`;
                    ctx.fill();
                }
            });

            // Nebula wisps
            ctx.save();
            ctx.globalAlpha = 0.025;
            const nebula = ctx.createRadialGradient(
                W * 0.3, H * 0.2, 0,
                W * 0.3, H * 0.2, W * 0.5
            );
            nebula.addColorStop(0, '#6b4c9a');
            nebula.addColorStop(1, 'transparent');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, W, H);
            ctx.restore();

            requestAnimationFrame(draw);
        }

        resize();
        createStars(Math.floor(window.innerWidth * window.innerHeight / 4000));
        draw();

        window.addEventListener('resize', () => {
            resize();
            createStars(Math.floor(window.innerWidth * window.innerHeight / 4000));
        });
    })();
    </script>

</body>
</html>
